name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable', check-latest: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true
      - name: Build
        run: python tools/build.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with: { name: app-release, path: app/build/outputs/apk/release/app-release.apk }
      # Приложение обновляет себя прямо из GitHub Releases: APK кладётся туда же,
      # версия берётся из versionName. Версии 0.0.* помечаются как предварительные —
      # их получает только бета-канал.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          sha256sum "$APK"
          EXTRA=""
          case "$VER" in 0.0.*) EXTRA="--prerelease" ;; esac
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$APK#SaveMyBox-$VER.apk" --clobber
          else
            gh release create "v$VER" "$APK#SaveMyBox-$VER.apk" \
              --title "SaveMyBox $VER" \
              --notes "Сборка $VER. Обновление ставится из приложения: Настройки → Обновления." \
              $EXTRA
          fi
